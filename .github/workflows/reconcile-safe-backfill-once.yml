name: One-time safe reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-safe-backfill-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-safe-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run reconciliation
        id: run_reconciliation
        continue-on-error: true
        run: python scripts/run_one_time_reconciliation.py

      - name: Record result and remove temporary files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f api/internal/reconcile-safe-backfill-f179b8536c79fb2e341a3cbf.py || true
          git rm -f scripts/run_one_time_reconciliation.py || true
          git add ops/reconciliation_v1_0_19_live_result.json || true
          if ! git diff --cached --quiet; then
            git commit -m "ops: record live reconciliation result"
            git push origin HEAD:main
          fi

      - name: Enforce result
        if: steps.run_reconciliation.outcome != 'success'
        run: exit 1
