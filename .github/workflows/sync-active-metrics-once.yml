name: Sync active metrics once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-active-metrics-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEALTH_URL: https://project-dcd2y.vercel.app/api/health
      METRICS_URL: https://project-dcd2y.vercel.app/api/cron/multiplatform-metrics
      REPORTING_URL: https://project-dcd2y.vercel.app/api/cron/reporting
      OIDC_AUDIENCE: rngn-reels-wc-worker
    steps:
      - name: Wait for production v1.0.46
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            BODY="$(curl --fail --silent --show-error --max-time 15 "${HEALTH_URL}" || true)"
            VERSION="$(jq -r '.version // ""' <<<"${BODY}" 2>/dev/null || true)"
            if [[ "${VERSION}" == "1.0.46" ]]; then
              echo "Production v1.0.46 is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for v1.0.46" >&2
          exit 1

      - name: Get GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert value; print(value)' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" > /tmp/oidc_token

      - name: Match by Content Core titles and sync metrics
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/oidc_token)"
          STATUS="$(curl --silent --show-error --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --output /tmp/metrics.json \
            --write-out '%{http_code}' \
            "${METRICS_URL}")"
          cat /tmp/metrics.json
          echo
          test "${STATUS}" = "200"
          jq -e '.ok == true and (.title_discovery.videos_scanned // 0) >= 1' /tmp/metrics.json >/dev/null

      - name: Refresh human reporting after Sheets quota window
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/oidc_token)"
          sleep 70
          for attempt in 1 2 3; do
            STATUS="$(curl --silent --show-error --max-time 300 \
              --request POST \
              --header "Authorization: Bearer ${TOKEN}" \
              --output /tmp/reporting.json \
              --write-out '%{http_code}' \
              "${REPORTING_URL}")"
            cat /tmp/reporting.json
            echo
            if [[ "${STATUS}" = "200" ]] && jq -e '.ok == true and .author_performance.rows >= 1' /tmp/reporting.json >/dev/null; then
              exit 0
            fi
            if [[ "${attempt}" != "3" ]]; then
              sleep 70
            fi
          done
          exit 2
