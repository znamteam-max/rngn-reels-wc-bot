name: Single-call report v1.0.20 finalizer

on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-report-v1-0-20-push.yml]

permissions:
  contents: write
  id-token: write

concurrency:
  group: single-call-report-v1-0-20
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production endpoint and finalize in one request
        id: run
        shell: bash
        env:
          ENDPOINT: https://project-dcd2y.vercel.app/api/internal/finish-report-v1-0-20-once
          OIDC_AUDIENCE: rngn-reels-wc-worker
        run: |
          set +e
          mkdir -p ops
          ready=0
          for i in $(seq 1 120); do
            OIDC_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" 2>/dev/null)" || { sleep 5; continue; }
            OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${OIDC_RESPONSE}")"
            echo "::add-mask::${OIDC_TOKEN}"
            status="$(curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer ${OIDC_TOKEN}" \
              --output /tmp/report-status.json \
              --write-out '%{http_code}' \
              "${ENDPOINT}" 2>/dev/null)"
            if [ "${status}" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "1" ]; then
            echo '{"ok":false,"error":"endpoint unavailable"}' > ops/report_v1_0_20_final.json
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fresh token for the single long-running mutation/finalization request.
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${OIDC_RESPONSE}")"
          echo "::add-mask::${OIDC_TOKEN}"
          http="$(curl --silent --show-error --max-time 295 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --output ops/report_v1_0_20_final.json \
            --write-out '%{http_code}' \
            "${ENDPOINT}")"
          python - <<'PY'
          import json
          p=json.load(open('ops/report_v1_0_20_final.json',encoding='utf-8'))
          print(json.dumps({
              'ok': p.get('ok'),
              'checks': p.get('checks'),
              'deleted_tabs': p.get('deleted_tabs'),
              'preamble_sheet_count': (p.get('preambles') or {}).get('sheet_count'),
              'preamble_failures': (p.get('preambles') or {}).get('failures'),
              'final': p.get('final'),
          }, ensure_ascii=False, indent=2, default=str))
          PY
          if [ "${http}" = "200" ] && python -c 'import json; assert json.load(open("ops/report_v1_0_20_final.json",encoding="utf-8")).get("ok") is True'; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Cleanup one-time access and save final report
        if: steps.run.outputs.exit_code == '0'
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('bot/github_oidc.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              '# Temporary one-time ops allowance for single-call report v1.0.20 finalizer.\nGITHUB_EVENTS = {"schedule", "workflow_dispatch", "push"}',
              'GITHUB_EVENTS = {"schedule", "workflow_dispatch"}',
          )
          p.write_text(t,encoding='utf-8')
          PY
          git rm -f api/internal/finish-report-v1-0-20-once.py || true
          git rm -f api/internal/finalize-report-v1-0-20-93c1e7.py || true
          git rm -f scripts/finalize_report_v1_0_20.py || true
          git rm -f .github/workflows/finalize-report-v1-0-20.yml || true
          git rm -f .github/workflows/finish-report-v1-0-20-push.yml || true
          git add bot/github_oidc.py ops/report_v1_0_20_final.json
          git commit -m "ops: complete report v1.0.20 final validation"
          git push origin HEAD:main

      - name: Enforce final result
        shell: bash
        run: |
          test "${{ steps.run.outputs.exit_code }}" = "0"
