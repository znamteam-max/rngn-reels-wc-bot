name: Check Egor four once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-egor-four-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read production result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          ok=0
          for i in $(seq 1 60); do
            code="$(curl --silent --show-error --max-time 15 --output /tmp/result.json --write-out '%{http_code}' https://project-dcd2y.vercel.app/api/internal/check-egor-four || true)"
            if [ "$code" = "200" ]; then
              python - <<'PY'
import json
p=json.load(open('/tmp/result.json',encoding='utf-8'))
assert p.get('ok') is True
json.dump(p,open('ops/check_egor_four_result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
PY
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/check_egor_four_result.json
          git commit -m "ops: record Egor four live DB check"
          git push origin HEAD:main
