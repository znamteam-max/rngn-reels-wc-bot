name: Apply reporting v2 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-reporting-v2.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rebuild reporting sheets and expose failures
        shell: bash
        env:
          HEALTH_URL: https://project-dcd2y.vercel.app/api/health
          REPORTING_URL: https://project-dcd2y.vercel.app/api/cron/reporting
          OIDC_AUDIENCE: rngn-reels-wc-worker
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            HEALTH="$(curl --fail --silent --show-error --max-time 15 "${HEALTH_URL}" || true)"
            VERSION="$(jq -r '.version // ""' <<<"${HEALTH}" 2>/dev/null || true)"
            if [[ "${VERSION}" == "1.0.39" ]]; then
              echo "Production v1.0.39 is ready."
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              echo "Timed out waiting for production v1.0.39; current version=${VERSION}" >&2
              exit 1
            fi
            sleep 10
          done

          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value; print(value)' <<<"${OIDC_RESPONSE}")"
          echo "::add-mask::${OIDC_TOKEN}"

          STATUS="$(curl --silent --show-error --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --output reporting-v2.json \
            --write-out '%{http_code}' \
            "${REPORTING_URL}")"
          echo "Reporting HTTP ${STATUS}"
          cat reporting-v2.json
          echo
          if [[ ! "${STATUS}" =~ ^2 ]]; then
            exit 2
          fi
          jq -e '.ok == true and .reporting_v2.active_projects >= 1 and .reporting_layout.stale_tabs_deleted >= 0' reporting-v2.json >/dev/null
