name: Sheet layout v1.0.21 migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/sheets-layout-v1-0-21.yml]

permissions:
  contents: write
  id-token: write

concurrency:
  group: sheet-layout-v1-0-21
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare permanent code changes
        shell: bash
        run: |
          set -e
          python scripts/prepare_sheet_layout_v1_0_21_once.py
          python -m py_compile bot/sheets.py bot/sheet_layout.py bot/sheet_preambles.py bot/github_oidc.py api/internal/sheets-layout-v1-0-21.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/sheets.py bot/github_oidc.py
          git commit -m "feat: finish one-line sheet layout support"
          git push origin HEAD:main

      - name: Apply layout to production Google Sheets
        id: apply
        shell: bash
        env:
          ENDPOINT: https://project-dcd2y.vercel.app/api/internal/sheets-layout-v1-0-21
          OIDC_AUDIENCE: rngn-reels-wc-worker
        run: |
          set +e
          mkdir -p ops
          ready=0
          for i in $(seq 1 120); do
            OIDC_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" 2>/dev/null)" || { sleep 5; continue; }
            OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${OIDC_RESPONSE}")"
            echo "::add-mask::${OIDC_TOKEN}"
            status="$(curl --silent --show-error --max-time 15 \
              --header "Authorization: Bearer ${OIDC_TOKEN}" \
              --output /tmp/layout-ready.json \
              --write-out '%{http_code}' \
              "${ENDPOINT}" 2>/dev/null)"
            if [ "${status}" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "1" ]; then
            echo '{"ok":false,"error":"endpoint unavailable"}' > ops/sheet_layout_v1_0_21_result.json
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${OIDC_RESPONSE}")"
          echo "::add-mask::${OIDC_TOKEN}"
          http="$(curl --silent --show-error --max-time 240 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --output ops/sheet_layout_v1_0_21_result.json \
            --write-out '%{http_code}' \
            "${ENDPOINT}")"
          cat ops/sheet_layout_v1_0_21_result.json
          if [ "${http}" = "200" ] && python -c 'import json; assert json.load(open("ops/sheet_layout_v1_0_21_result.json",encoding="utf-8")).get("ok") is True'; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Remove one-time migration access
        if: steps.apply.outputs.exit_code == '0'
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('bot/github_oidc.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              '# Temporary one-time allowance for sheet layout v1.0.21.\nGITHUB_EVENTS = {"schedule", "workflow_dispatch", "push"}',
              'GITHUB_EVENTS = {"schedule", "workflow_dispatch"}',
          )
          p.write_text(t,encoding='utf-8')
          PY
          git rm -f api/internal/sheets-layout-v1-0-21.py
          git rm -f scripts/prepare_sheet_layout_v1_0_21_once.py
          git rm -f .github/workflows/sheets-layout-v1-0-21.yml
          git add bot/github_oidc.py ops/sheet_layout_v1_0_21_result.json
          git commit -m "ops: complete sheet layout v1.0.21 migration"
          git push origin HEAD:main

      - name: Enforce migration result
        shell: bash
        run: |
          test "${{ steps.apply.outputs.exit_code }}" = "0"
