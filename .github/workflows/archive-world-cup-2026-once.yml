name: One-time World Cup 2026 archive migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archive-world-cup-2026-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: one-time-world-cup-2026-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source support and temporary endpoint
        shell: bash
        run: |
          set -e
          python scripts/prepare_world_cup_2026_archive_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/projects.py bot/reconciliation.py bot/sheets.py bot/github_oidc.py api/internal/archive-world-cup-2026-5d9f7a2c91.py
          git commit -m "feat: add archived World Cup 2026 reporting project"
          git push origin HEAD:main

      - name: Run live archive migration and reconciliation
        id: migration
        shell: bash
        run: |
          set +e
          python scripts/run_world_cup_2026_archive_live.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cleanup temporary ops files
        if: always()
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('bot/github_oidc.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '# Temporary one-time ops allowance for World Cup 2026 archive migration.\nGITHUB_EVENTS = {"schedule", "workflow_dispatch", "push"}',
              'GITHUB_EVENTS = {"schedule", "workflow_dispatch"}',
          )
          path.write_text(text, encoding='utf-8')
          PY
          git rm -f api/internal/archive-world-cup-2026-5d9f7a2c91.py || true
          git rm -f scripts/prepare_world_cup_2026_archive_once.py || true
          git rm -f scripts/run_world_cup_2026_archive_live.py || true
          git rm -f .github/workflows/archive-world-cup-2026-once.yml || true
          git add bot/github_oidc.py ops/world_cup_2026_archive_result.json || true
          git commit -m "ops: complete World Cup 2026 archive migration"
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          code="${{ steps.migration.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "World Cup 2026 archive migration did not pass validation"
            exit 1
          fi
