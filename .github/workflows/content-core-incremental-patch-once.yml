name: Content Core Incremental Patch Once

on:
  push:
    branches: [main]
    paths:
      - ".content-core-incremental-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Make daily Content Core metrics sync incremental
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('bot/multiplatform_metrics.py')
          text=path.read_text(encoding='utf-8')
          old='from datetime import date, datetime, time, timezone'
          new='from datetime import date, datetime, time, timedelta, timezone'
          if text.count(old) != 1:
              raise SystemExit(f'datetime import mismatch: {text.count(old)}')
          text=text.replace(old,new)

          old='''def _fetch_core_rows() -> list[dict[str, str]]:\n    response = requests.get(CONTENT_CORE_BRIDGE_URL, timeout=40)\n    response.raise_for_status()\n    return list(csv.DictReader(io.StringIO(response.text), delimiter="\\t"))\n'''
          new='''def _fetch_core_rows(*, lookback_days: int | None = None) -> list[dict[str, str]]:\n    params: dict[str, str] = {}\n    if lookback_days is not None:\n        days = max(1, min(31, int(lookback_days)))\n        since = datetime.now(timezone.utc) - timedelta(days=days)\n        params["since"] = since.isoformat().replace("+00:00", "Z")\n    response = requests.get(CONTENT_CORE_BRIDGE_URL, params=params or None, timeout=40)\n    response.raise_for_status()\n    return list(csv.DictReader(io.StringIO(response.text), delimiter="\\t"))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'fetch block mismatch: {text.count(old)}')
          text=text.replace(old,new)

          old='    rows = _fetch_core_rows()\n'
          new='    rows = _fetch_core_rows(lookback_days=3)\n'
          if text.count(old) != 1:
              raise SystemExit(f'core rows call mismatch: {text.count(old)}')
          text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Add and run source-level regression guard
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_content_core_incremental_bridge.py <<'PY'
          from __future__ import annotations
          from pathlib import Path

          SOURCE = (Path(__file__).resolve().parents[1] / "bot" / "multiplatform_metrics.py").read_text(encoding="utf-8")

          def test_daily_core_metrics_sync_is_incremental() -> None:
              assert "_fetch_core_rows(lookback_days=3)" in SOURCE
              assert 'params["since"]' in SOURCE
              assert "timedelta(days=days)" in SOURCE
              assert "max(1, min(31" in SOURCE
          PY
          python - <<'PY'
          from pathlib import Path
          source=Path('bot/multiplatform_metrics.py').read_text(encoding='utf-8')
          assert '_fetch_core_rows(lookback_days=3)' in source
          assert 'params["since"]' in source
          assert 'timedelta(days=days)' in source
          assert 'max(1, min(31' in source
          print('incremental bridge source guard: ok')
          PY
          python -m py_compile bot/multiplatform_metrics.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/multiplatform_metrics.py tests/test_content_core_incremental_bridge.py
          git commit -m 'perf: make Content Core metrics bridge incremental'
          git pull --rebase origin main
          git push origin main
