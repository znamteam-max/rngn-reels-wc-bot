name: Finalize report v1.0.20

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: finalize-report-v1-0-20
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize database and Google Sheets report
        id: finalize
        shell: bash
        run: |
          set +e
          python scripts/finalize_report_v1_0_20.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Store final result and remove one-time finalizer
        if: steps.finalize.outputs.exit_code == '0'
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f api/internal/finalize-report-v1-0-20-93c1e7.py
          git rm -f scripts/finalize_report_v1_0_20.py
          git rm -f .github/workflows/finalize-report-v1-0-20.yml
          git add ops/report_v1_0_20_final.json
          git commit -m "ops: finalize report v1.0.20"
          git push origin HEAD:main

      - name: Enforce final result
        shell: bash
        run: |
          test "${{ steps.finalize.outputs.exit_code }}" = "0"
