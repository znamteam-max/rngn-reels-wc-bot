name: Atomic World Cup 2026 archive migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-world-cup-2026-atomic.yml]

permissions:
  contents: write
  id-token: write

concurrency:
  group: atomic-world-cup-2026-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run archive and reconciliation
        id: migrate
        shell: bash
        run: |
          set +e
          python scripts/run_world_cup_2026_archive_atomic.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit result and remove one-time access
        if: always()
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('bot/github_oidc.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('# Temporary one-time ops allowance for World Cup 2026 archive migration.\nGITHUB_EVENTS = {"schedule", "workflow_dispatch", "push"}','GITHUB_EVENTS = {"schedule", "workflow_dispatch"}')
          p.write_text(t,encoding='utf-8')
          v=Path('vercel.json'); d=json.loads(v.read_text(encoding='utf-8')); d.pop('rewrites',None); v.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git rm -f api/internal/archive-world-cup-2026-atomic.py
          git rm -f scripts/run_world_cup_2026_archive_atomic.py
          git rm -f .github/workflows/archive-world-cup-2026-atomic.yml
          git add bot/github_oidc.py vercel.json ops/world_cup_2026_archive_result.json
          git commit -m "ops: complete atomic World Cup 2026 archive migration"
          git push origin HEAD:main
      - name: Enforce migration result
        if: always()
        shell: bash
        run: |
          test "${{ steps.migrate.outputs.exit_code }}" = "0"
