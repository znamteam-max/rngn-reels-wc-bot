name: Content Core Direct Link Patch Once

on:
  push:
    branches: [main]
    paths:
      - ".content-core-link-direct-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Persist Content Core publication ids from attach response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('bot/content_core_integration.py')
          text=path.read_text(encoding='utf-8')

          old='import io\nfrom typing import Any\n'
          new='import io\nimport re\nfrom typing import Any\n'
          if text.count(old) != 1:
              raise SystemExit(f'import anchor mismatch: {text.count(old)}')
          text=text.replace(old,new)

          anchor='''def _attach_url(target: str, platform: str, url: str) -> tuple[bool, int, str]:\n'''
          helper='''def _publication_id_from_attach_text(text: str) -> str:\n    match = re.search(r"(?:^|[·\\s])publication_id=([^\\s·]+)", str(text or ""))\n    return match.group(1).strip() if match else ""\n\n\ndef _record_attached_publication_link(\n    video: dict[str, Any],\n    platform: str,\n    publication_id: str,\n    url: str,\n) -> bool:\n    platform_id = multiplatform_metrics._platform_id(video, platform)\n    if not publication_id or not platform_id:\n        return False\n    ensure_schema()\n    db.execute(\n        """\n        INSERT INTO content_core_publication_links (\n            video_id, content_core_publication_id, platform,\n            platform_video_id, url, first_seen_at, last_seen_at\n        )\n        VALUES (%s, %s, %s, %s, %s, now(), now())\n        ON CONFLICT (video_id, content_core_publication_id)\n        DO UPDATE SET\n            platform = EXCLUDED.platform,\n            platform_video_id = EXCLUDED.platform_video_id,\n            url = EXCLUDED.url,\n            last_seen_at = now()\n        """,\n        (int(video["id"]), publication_id, platform, platform_id, url or None),\n    )\n    return True\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'attach anchor mismatch: {text.count(anchor)}')
          text=text.replace(anchor,helper+anchor)

          old='''    submitted = _submitted_urls(video)\n    results: list[dict[str, Any]] = []\n    pending = False\n'''
          new='''    submitted = _submitted_urls(video)\n    results: list[dict[str, Any]] = []\n    publication_links = 0\n    pending = False\n'''
          if text.count(old) != 1:
              raise SystemExit(f'submitted block mismatch: {text.count(old)}')
          text=text.replace(old,new)

          old='''        results.append(\n            {\n                "platform": platform,\n                "ok": ok,\n                "status": status_code,\n                "response": text,\n            }\n        )\n        if ok:\n            continue\n'''
          new='''        publication_id = _publication_id_from_attach_text(text) if ok else ""\n        link_recorded = False\n        if publication_id:\n            link_recorded = _record_attached_publication_link(\n                video, platform, publication_id, url\n            )\n            publication_links += int(link_recorded)\n        results.append(\n            {\n                "platform": platform,\n                "ok": ok,\n                "status": status_code,\n                "response": text,\n                "publication_id": publication_id or None,\n                "link_recorded": link_recorded,\n            }\n        )\n        if ok:\n            continue\n'''
          if text.count(old) != 1:
              raise SystemExit(f'result block mismatch: {text.count(old)}')
          text=text.replace(old,new)

          old='''    publication_links = 0\n    try:\n        publication_links = _refresh_publication_links(video)\n    except Exception as exc:\n        results.append({"publication_link_refresh_error": _safe_error(exc)})\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'full bridge refresh block mismatch: {text.count(old)}')
          text=text.replace(old,'')
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile bot/content_core_integration.py
          ! grep -F 'publication_links = _refresh_publication_links(video)' bot/content_core_integration.py
          grep -F '_publication_id_from_attach_text' bot/content_core_integration.py >/dev/null
          grep -F '_record_attached_publication_link' bot/content_core_integration.py >/dev/null
      - name: Add regression guard
        shell: bash
        run: |
          cat > tests/test_content_core_direct_publication_link.py <<'PY'
          from pathlib import Path

          SOURCE=(Path(__file__).resolve().parents[1]/'bot'/'content_core_integration.py').read_text(encoding='utf-8')

          def test_attach_response_persists_publication_id_without_full_metrics_refresh() -> None:
              assert '_publication_id_from_attach_text' in SOURCE
              assert '_record_attached_publication_link' in SOURCE
              assert 'publication_links = _refresh_publication_links(video)' not in SOURCE
          PY
          python - <<'PY'
          from pathlib import Path
          source=Path('bot/content_core_integration.py').read_text(encoding='utf-8')
          assert '_publication_id_from_attach_text' in source
          assert '_record_attached_publication_link' in source
          assert 'publication_links = _refresh_publication_links(video)' not in source
          print('direct publication link guard: ok')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/content_core_integration.py tests/test_content_core_direct_publication_link.py
          git commit -m 'perf: persist Content Core publication links from attach response'
          git pull --rebase origin main
          git push origin main
