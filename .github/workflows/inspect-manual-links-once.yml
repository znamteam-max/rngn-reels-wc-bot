name: Inspect manual cross-platform links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-manual-links-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect supplied VK clip pages
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, requests

          ids = ['456262542','456262491','456262433','456262393','456262387']
          headers = {'User-Agent': 'Mozilla/5.0'}
          for clip_id in ids:
              urls = [
                  f'https://vkvideo.ru/video_ext.php?oid=-202211208&id={clip_id}',
                  f'https://vk.com/video-202211208_{clip_id}',
                  f'https://vk.ru/video-202211208_{clip_id}',
              ]
              out = {'id': clip_id, 'attempts': []}
              for url in urls:
                  try:
                      r = requests.get(url, headers=headers, timeout=25, allow_redirects=True)
                      text = r.text
                      meta = {}
                      for key in ('og:title','og:description','twitter:title','twitter:description'):
                          patterns = [
                              rf'<meta[^>]+property=["\']{re.escape(key)}["\'][^>]+content=["\']([^"\']*)',
                              rf'<meta[^>]+content=["\']([^"\']*)["\'][^>]+property=["\']{re.escape(key)}["\']',
                              rf'<meta[^>]+name=["\']{re.escape(key)}["\'][^>]+content=["\']([^"\']*)',
                          ]
                          for p in patterns:
                              m = re.search(p, text, re.I)
                              if m:
                                  meta[key] = html.unescape(m.group(1))[:500]
                                  break
                      title = ''
                      mt = re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S)
                      if mt:
                          title = html.unescape(re.sub(r'\s+', ' ', mt.group(1))).strip()[:500]
                      out['attempts'].append({
                          'url': url, 'status': r.status_code, 'final_url': r.url,
                          'title': title, 'meta': meta,
                          'contains_id': clip_id in text,
                          'length': len(text),
                      })
                  except Exception as exc:
                      out['attempts'].append({'url': url, 'error': f'{type(exc).__name__}: {exc}'})
              print(json.dumps(out, ensure_ascii=False))
          PY
