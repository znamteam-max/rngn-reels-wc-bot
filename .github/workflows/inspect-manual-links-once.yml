name: Inspect manual cross-platform links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-manual-links-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Inspect supplied VK links
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, requests
          from bot import multiplatform_metrics

          wanted_ids = [
              '456262542',
              '456262491',
              '456262433',
              '456262393',
              '456262387',
          ]

          bridge = multiplatform_metrics.CONTENT_CORE_BRIDGE_URL
          prefix, _, rest = bridge.partition('/mirror/')
          token = rest.split('/', 1)[0]
          publications_url = f"{prefix.rstrip('/')}/mirror/{token}/publications.tsv"
          r = requests.get(publications_url, timeout=60)
          r.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(r.text), delimiter='\t'))
          print('HEADERS', json.dumps(rows[0].keys() if rows else [], ensure_ascii=False, default=list))

          found = 0
          for row in rows:
              blob = ' '.join(str(value or '') for value in row.values())
              matched = [item for item in wanted_ids if item in blob]
              if not matched:
                  continue
              found += 1
              print(json.dumps({
                  'matched_ids': matched,
                  'platform': row.get('platform'),
                  'publication_id': row.get('publication_id'),
                  'raw_video_id': row.get('raw_video_id'),
                  'project': row.get('project'),
                  'published_at': row.get('published_at'),
                  'external_post_id': row.get('external_post_id'),
                  'url': row.get('url'),
                  'caption': row.get('caption'),
                  'views': row.get('views'),
              }, ensure_ascii=False))
          print('FOUND', found)
          PY
