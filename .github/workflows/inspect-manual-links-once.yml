name: Inspect manual cross-platform links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-manual-links-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Read source Instagram captions
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, requests
          from bot import multiplatform_metrics

          wanted = {'DbwC0kAthzg': 363, 'Dbxi8ZnNcdN': 371}
          bridge = multiplatform_metrics.CONTENT_CORE_BRIDGE_URL
          prefix, _, rest = bridge.partition('/mirror/')
          token = rest.split('/', 1)[0]
          url = f"{prefix.rstrip('/')}/mirror/{token}/publications.tsv"
          r = requests.get(url, timeout=60)
          r.raise_for_status()
          rows = csv.DictReader(io.StringIO(r.text), delimiter='\t')
          found = 0
          for row in rows:
              if str(row.get('platform') or '') != 'instagram':
                  continue
              blob = ' '.join(str(v or '') for v in row.values())
              for shortcode, video_id in wanted.items():
                  if shortcode not in blob:
                      continue
                  found += 1
                  print(json.dumps({
                      'video_id': video_id,
                      'instagram_id': shortcode,
                      'published_at': row.get('published_at'),
                      'caption': row.get('caption'),
                      'url': row.get('url'),
                  }, ensure_ascii=False))
          print('FOUND', found)
          PY
