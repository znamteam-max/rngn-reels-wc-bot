name: Apply WC unpaid baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wc-unpaid-baseline.yml'

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply production baseline
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rngn-reels-wc-worker")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          url="https://project-dcd2y.vercel.app/api/internal/apply-wc-unpaid-baseline"
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "$url" || true)"
            echo "attempt=$attempt http=$code"
            cat /tmp/result.json || true
            echo
            if [ "$code" = "200" ]; then
              python - <<'PY'
import json
with open('/tmp/result.json', encoding='utf-8') as f:
    data = json.load(f)
assert data.get('ok') is True, data
assert data.get('approved_world_cup') == 309, data
assert data.get('reporting', {}).get('paid') == 0, data
assert data.get('reporting', {}).get('unmarked') == 0, data
print('WC unpaid baseline verified:', json.dumps(data, ensure_ascii=False))
PY
              exit 0
            fi
            sleep 5
          done
          echo 'Production endpoint did not become ready in time.' >&2
          exit 1
