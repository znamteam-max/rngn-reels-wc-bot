name: Capture live World Cup YouTube metrics

on:
  push:
    branches: [main]
    paths:
      - '.wc-youtube-live-trigger'

permissions:
  contents: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENDPOINT: https://project-dcd2y.vercel.app/api/internal/wc-youtube-live-20260819-6d2f
      OIDC_AUDIENCE: rngn-reels-wc-worker
    steps:
      - uses: actions/checkout@v4
      - name: Get GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" > /tmp/oidc_token
      - name: Wait for Vercel deployment and capture metrics
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/oidc_token)"
          ok=0
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${TOKEN}" \
              --output /tmp/report.json --write-out '%{http_code}' "${ENDPOINT}" || true)"
            echo "attempt=${attempt} status=${status}"
            if [ "${status}" = "200" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          test "${ok}" = "1"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/report.json', encoding='utf-8'))
          assert p.get('ok') is True, p
          print(json.dumps({k:p.get(k) for k in ['db_rows_with_youtube','resolved_youtube_ids','unique_youtube_ids','videos_with_live_stats','total_views','api_missing_ids','api_errors']}, ensure_ascii=False, indent=2))
          PY
          mkdir -p ops
          cp /tmp/report.json ops/wc-youtube-live-20260819.json
      - name: Persist report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add ops/wc-youtube-live-20260819.json
          git commit -m 'record live World Cup YouTube metrics' || exit 0
          git push
